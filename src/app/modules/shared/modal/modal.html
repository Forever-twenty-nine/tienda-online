@if (open()) {
  <div [@modalBackdrop] class="fixed inset-0 bg-ink/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" (click)="onBackdropClick($event)">
    <div [@modalContent] class="bg-canvas rounded-[20px] shadow-2xl max-w-[700px] w-full max-h-[90vh] overflow-y-auto relative" (click)="$event.stopPropagation()">
      <button class="absolute top-4 right-4 bg-transparent border-none text-2xl text-ink-48 cursor-pointer hover:text-ink transition-colors z-10 w-10 h-10 flex items-center justify-center" (click)="close.emit()" aria-label="Cerrar">&times;</button>
      <ng-content></ng-content>
    </div>
  </div>
}
