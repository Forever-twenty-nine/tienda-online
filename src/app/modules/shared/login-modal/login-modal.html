@if (open()) {
  <app-modal [open]="open()" (close)="closeModal()">
    <div class="bg-canvas rounded-[20px] py-10 px-8 max-w-md mx-auto">
      <div class="flex gap-3 mb-8 w-full items-center">
        <span class="flex bg-action/10 p-3 rounded-full">
          <svg class="w-6 h-6 text-action" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </span>
        <span>
          <h2 class="text-xl font-ftn-bold text-ink">Inicia Sesión</h2>
          <p class="text-sm text-ink-48">Gestiona tu tienda desde cualquier lugar</p>
        </span>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        @if (showError) {
          <div class="mb-4 p-3 bg-danger/10 border border-danger/20 rounded-lg">
            <p class="text-danger text-sm flex items-center">
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              {{ errorMessage }}
            </p>
          </div>
        }

        <div class="mb-5">
          <label for="email" class="block text-sm font-ftn-bold text-ink mb-2">
            Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="credentials.email"
            required
            autocomplete="email"
            class="w-full px-4 py-3 rounded-lg border border-hairline text-ink placeholder:text-ink-48 bg-canvas transition-colors focus:outline-none focus:border-action min-h-[44px]"
            placeholder="tu@email.com"
            [class.border-danger]="showError">
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-ftn-bold text-ink mb-2">
            Contraseña
          </label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="credentials.password"
              required
              class="w-full px-4 py-3 rounded-lg border border-hairline text-ink placeholder:text-ink-48 bg-canvas transition-colors focus:outline-none focus:border-action min-h-[44px]"
              placeholder="Ingrese su contraseña"
              [class.border-danger]="showError">
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-48 hover:text-ink transition-colors w-9 h-9 flex items-center justify-center"
              aria-label="Mostrar contraseña">
              @if (!showPassword) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              }
              @if (showPassword) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                </svg>
              }
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="!loginForm.valid || isLoading"
          class="cursor-pointer w-full px-4 py-3 bg-action text-white font-ftn-bold rounded-full hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-h-[44px]">
          @if (isLoading) {
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Verificando...
          } @else {
            Iniciar Sesión
          }
        </button>

        <div class="mt-4 text-center">
          <button
            type="button"
            (click)="closeModal()"
            class="cursor-pointer px-4 py-2 text-sm text-ink-80 hover:text-ink hover:bg-cool-wash rounded-full transition-colors">
            Volver a la Tienda
          </button>
        </div>

        <div class="mt-4 p-3 bg-cool-wash rounded-lg">
          <p class="text-xs text-ink-48 text-center">
            Demo: <strong class="text-ink">sebastianechazu@gmail.com</strong> · <strong class="text-ink">admin123</strong>
          </p>
        </div>
      </form>
    </div>
  </app-modal>
}
