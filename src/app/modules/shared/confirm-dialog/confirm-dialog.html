@if (open()) {
  <app-modal [open]="open()" (close)="cancel.emit()">
    <div class="bg-canvas w-full p-8 relative">
      <h3 class="text-xl font-ftn-bold mb-3 text-ink">
        {{ title() }}
      </h3>
      <p class="mb-6 text-ink-80 leading-relaxed">
        {{ message() }}
      </p>
      <div class="flex justify-end gap-3 border-t border-hairline pt-6 mt-2">
        <button (click)="cancel.emit()" class="
          bg-cool-wash text-ink
          px-6 py-3 font-ftn-bold rounded-full cursor-pointer
          hover:bg-hairline transition-colors
          min-h-[44px]">
          {{ cancelText() }}
        </button>
        <button (click)="confirm.emit()" class="
          bg-danger text-white
          px-6 py-3 font-ftn-bold rounded-full cursor-pointer
          hover:opacity-90 transition-opacity
          min-h-[44px]">
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </app-modal>
}
